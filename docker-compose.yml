services:
  tg_media_bot:
    build: .
    container_name: video_downloader_bot
    restart: unless-stopped
    init: true
    shm_size: '512mb'
    
    # 【核心魔法 1】：共享主机网络
    network_mode: "host" 
    
    # 【核心魔法 2】：文件夹穿透映射
    volumes:
      - /var/lib/telegram-bot-api:/var/lib/telegram-bot-api
      
    # 让 Docker 自动读取环境变量文件
    env_file:
      - .env

    # 防止 Docker 的 json-file 日志无限增长
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
